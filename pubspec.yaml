name: superso_flutter_sdk
description: >-
  Official Flutter SDK for Superso Core — a unified backend platform providing
  Auth, Database, Storage, Realtime, Media, Notifications, Payments and AI
  through a single strongly-typed client.
version: 0.3.0
repository: https://github.com/superso/superso_core
issue_tracker: https://github.com/superso/superso_core/issues
documentation: https://docs.superso.io

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP transport. Chosen over dart:io's HttpClient so the SDK works
  # unchanged on Flutter Web, where dart:io is unavailable.
  http: ^1.2.0
  # WebSocket transport for the Realtime and Media signalling modules.
  # web_socket_channel abstracts dart:io vs dart:html, again for Web parity.
  web_socket_channel: ^2.4.0
  # Value equality for immutable models without hand-written == / hashCode.
  meta: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Mock HTTP client used across the unit test suite.
  http_parser: ^4.0.2

flutter:
